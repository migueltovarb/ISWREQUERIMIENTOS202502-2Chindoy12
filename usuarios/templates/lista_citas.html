<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mis citas</title>
    <style>
        body { background: #eaf8f0; font-family: Arial }
        .contenedor { width: 800px; margin: 30px auto }
        a.btn { background:#2ea86b; color:white; padding:8px 12px; border-radius:6px; text-decoration:none }
        table { width:100%; border-collapse:collapse; margin-top:12px }
        th, td { padding:8px; border-bottom:1px solid #ddd }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Mis citas</h2>
        <a class="btn" href="{% url 'crear_cita' %}">Nueva cita</a>
        <table>
            <thead><tr><th>Mascota</th><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody>
            {% for c in citas %}
                <tr>
                    <td>{{ c.mascota.nombre }}</td>
                    <td>{{ c.get_tipo_display }}</td>
                    <td>{{ c.fecha_inicio }}</td>
                    <td>{{ c.fecha_fin }}</td>
                    <td>{{ c.get_estado_display }}</td>
                    <td>
                        <a href="{% url 'editar_cita' c.pk %}">Editar</a> |
                        <a href="{% url 'cancelar_cita' c.pk %}">Cancelar</a>
                    </td>
                </tr>
            {% empty %}
                <tr><td colspan="6">No hay citas programadas.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
