<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Registrar mascota</title>
    <style>
        body { background: #e8f4ff; font-family: Arial }
        .contenedor { width: 520px; margin: 40px auto; background: white; padding: 20px; border-radius: 8px }
        button { background: #2e8bff; color: white; padding: 10px 14px; border: none; border-radius: 6px }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Registrar mascota</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar</button>
        </form>
    </div>
</body>
</html>
