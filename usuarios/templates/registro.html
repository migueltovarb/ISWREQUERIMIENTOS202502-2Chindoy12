<!DOCTYPE html>
<html>
<head>
    <title>Registro</title>
    <style>
        body {
            background: #c2d8f0;
            font-family: Arial;
        }
        .contenedor {
            width: 350px;
            margin: 70px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Registrarse</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Crear cuenta</button>
        </form>
    </div>
</body>
</html>
