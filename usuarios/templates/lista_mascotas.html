<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mis mascotas</title>
    <style>
        body { background: #e8f4ff; font-family: Arial }
        .contenedor { width: 700px; margin: 30px auto }
        a.btn { background:#2e8bff; color:white; padding:8px 12px; border-radius:6px; text-decoration:none }
        table { width:100%; border-collapse:collapse; margin-top:12px }
        th, td { padding:8px; border-bottom:1px solid #ddd }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Mis mascotas</h2>
        <a class="btn" href="{% url 'crear_mascota' %}">Nueva mascota</a>
        <table>
            <thead><tr><th>Nombre</th><th>Especie</th><th>Raza</th><th>Acciones</th></tr></thead>
            <tbody>
            {% for m in mascotas %}
                <tr>
                    <td>{{ m.nombre }}</td>
                    <td>{{ m.especie }}</td>
                    <td>{{ m.raza }}</td>
                    <td><a href="{% url 'detalle_mascota' m.pk %}">Ver</a></td>
                </tr>
            {% empty %}
                <tr><td colspan="4">No tienes mascotas registradas.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
