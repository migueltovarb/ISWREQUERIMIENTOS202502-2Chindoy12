{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <h2 class="auth-title">Iniciar sesión</h2>
    {% if messages %}
      {% for m in messages %}
        <div class="error">{{ m }}</div>
      {% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Usuario o email</label>
      <input type="text" name="username" value="{{ request.POST.username }}" required />
      <label>Contraseña</label>
      <input type="password" name="password" required />
      <button type="submit">Entrar</button>
    </form>
    <p class="muted">No tienes cuenta? <a href="{% url 'register' %}">Regístrate aquí</a></p>
  </div>
</div>
{% endblock %}
